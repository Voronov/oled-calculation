<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Калькулятор OLED</title>
  <defs>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6ffd4"/>
      <stop offset="0.45" stop-color="#3ce887"/>
      <stop offset="1" stop-color="#0f9a53"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162134"/>
      <stop offset="1" stop-color="#060a11"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#panel)"/>

  <!-- glow around the emission band -->
  <path d="M2 25 C6.5 25 8.5 4.6 14 4.6 C19.5 4.6 20.5 15.6 24 20.6 C26 23.5 28 25 30 25 Z"
        fill="#3ce887" opacity="0.22"/>

  <!-- emission spectrum: steep rise, long tail, like the measured EL curve -->
  <path d="M3 25 C7 25 9.6 6.8 14 6.8 C18.4 6.8 19.4 16.4 22.6 20.8 C24.6 23.6 26.6 25 29 25 Z"
        fill="url(#peak)"/>
  <path d="M3 25 C7 25 9.6 6.8 14 6.8 C18.4 6.8 19.4 16.4 22.6 20.8 C24.6 23.6 26.6 25 29 25"
        fill="none" stroke="#e8fff2" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
